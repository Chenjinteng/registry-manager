# 用法：
#   cp .env.example .env      # 所有变量的说明都在 .env.example 里
#   docker compose up -d --build
#
# 不写 version 键：Compose v2 已废弃它，写上只会多一条警告。
#
# 这里只负责"接线"：变量一律从 .env 取，解释统一放在 .env.example，
# 免得同一句说明在两个文件里各写一份、迟早说不到一起去。

services:
  registry-manager:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}

    image: ${IMAGE:-registry-manager:0.8.0}
    container_name: registry-manager
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-8787}:8787"

    environment:
      REGISTRY_URL: ${REGISTRY_URL:?请在 .env 里设置 REGISTRY_URL，参考 .env.example}
      REGISTRY_NAME: ${REGISTRY_NAME:-镜像仓库}
      REGISTRY_PROXY: ${REGISTRY_PROXY:-}
      REGISTRY_USERNAME: ${REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
      REGISTRY_CACHE_TTL_SECONDS: ${REGISTRY_CACHE_TTL_SECONDS:-60}
      REGISTRY_ALLOW_DELETE: ${REGISTRY_ALLOW_DELETE:-true}
      REGISTRY_ALLOW_PULL: ${REGISTRY_ALLOW_PULL:-true}
      REGISTRY_PULL_QUEUE_SIZE: ${REGISTRY_PULL_QUEUE_SIZE:-50}
      REGISTRY_PULL_HISTORY_RETENTION_DAYS: ${REGISTRY_PULL_HISTORY_RETENTION_DAYS:-90}
      REGISTRY_NOTIFY_TOKEN: ${REGISTRY_NOTIFY_TOKEN:-}
      REGISTRY_ALLOW_REGISTRY_EVENTS: ${REGISTRY_ALLOW_REGISTRY_EVENTS:-true}
      REGISTRY_STATS_RETENTION_DAYS: ${REGISTRY_STATS_RETENTION_DAYS:-90}
      REGISTRY_STATS_IGNORE_USERAGENTS: ${REGISTRY_STATS_IGNORE_USERAGENTS:-}
      REGISTRY_CREDENTIAL_KEY: ${REGISTRY_CREDENTIAL_KEY:?请设置 REGISTRY_CREDENTIAL_KEY；任意随机 32+ 字符字符串，启动后切勿丢失}
      REGISTRY_CREDENTIALS_DIR: ${REGISTRY_CREDENTIALS_DIR:-/app/data}

    # 数据目录要持久化，否则容器一重建凭据、代理、热度历史就都没了。
    # 命名卷在首次挂载空目录时会沿用镜像里 /app/data 的属主（node:node），
    # 所以非 root 的 node 用户能写。若改用 bind mount，宿主机目录的属主
    # 必须是 uid 1000，否则同样会以 EACCES / EPERM 初始化失败。
    volumes:
      - registry-manager-data:/app/data

    # 健康检查继承自镜像（Dockerfile 里的 HEALTHCHECK，探 /api/config），
    # 这里不重复声明，避免两处漂移。

    # 可选：改用配置文件而不是环境变量（追加到上面的 volumes 列表即可）。
    # 注意环境变量优先级更高，两者同时存在时以环境变量为准。
    #   - ./registry.config.json:/app/registry.config.json:ro

volumes:
  registry-manager-data:
